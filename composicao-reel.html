      .dots {

      .dot { width: 16px; height: 6px; border-radius: 3px; background: var(--muted); }
      .dot.on { width: 46px; background: var(--accent); }
      .grain {
        position: absolute; inset: 0; pointer-events: none; z-index: 50; opacity: 0.10; mix-blend-mode: overlay;
